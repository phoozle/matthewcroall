---
layout: default
---

{% for post in site.posts %}
  <a href="{{ post.url }}" class="block border-b border-blue-500 py-4 pl-2 group">
    <span class="font-bold group-hover:underline">{{ post.title }}</span><br>

    <span class="font-extralight italic text-black/50 dark:text-white/50 group-hover:text-black dark:group-hover:text-white">
      {{ post.excerpt | strip_html }}
    </span>
  </a>
{% endfor %}
