on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Ruby and Node versions come from mise.toml, as they do locally.
    - uses: jdx/mise-action@v5

    - name: Install dependencies
      run: |
        npm ci
        bundle install

    - name: Build the site
      run: npm run build

    # Every branch builds; only a push to main publishes.
    - name: GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: crazy-max/ghaction-github-pages@v5
      with:
        build_dir: _site/
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
