<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Matthew Croall</title>

    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">

    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  </head>
  <body class="dark:bg-gray-800 dark:text-white font-serif h-screen">
    <div class="h-full flex flex-col">
      <header
        class="z-10 sticky top-0 text-white sm:subpixel-antialiased md:antialiased bg-linear-to-r from-indigo-800 to-blue-500"
      >
        <div
          class="absolute inset-0 opacity-30"
          style="background-image: url('/assets/images/pixels.png'); background-size: 2.5px;"
        ></div>

        <div class="relative z-1 flex flex-wrap items-center max-w-3xl mx-auto">
          <h1 class="px-4 md:px-0 py-4 md:text-2xl font-lato">
            <a href="/" class="flex items-center p-1 bg-black/0 hover:bg-black/50">
              Matthew Croall
            </a>
          </h1>

          <aside class="flex ml-auto px-4 md:px-0 py-4 space-x-4 items-center">
            <a href="https://github.com/phoozle" target="_blank">
              <img class="w-8 hover:opacity-80" src="/assets/images/github.png" alt="Github">
            </a>

            <a href="mailto:{{ site.email }}" class="underline">
              <img class="w-8 hover:opacity-80" src="/assets/images/email.svg" alt="Email me">
            </a>
          </aside>
        </div>
      </header>

      <section class="max-w-3xl mx-4 grow self-center">
        {{ content }}
      </section>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init({
        once: true,
        mirror: false,
        duration: 700,
        disable: 'mobile',
        debounceDelay: 500
      });
    </script>
  </body>
</html>
